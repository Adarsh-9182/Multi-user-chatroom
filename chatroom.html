<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexusChat — Multi-User Chatroom</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0e17;
    --surface: #13141f;
    --surface2: #1a1c2e;
    --surface3: #20233a;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --accent3: #38bdf8;
    --text: #e2e4f0;
    --muted: #6b7280;
    --online: #34d399;
    --radius: 14px;
    --sidebar-w: 280px;
    --panel-w: 240px;
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

  /* ---- LAYOUT ---- */
  .app { display: flex; height: 100vh; width: 100vw; }

  /* ---- ICON NAV ---- */
  .icon-nav {
    width: 64px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 6px; flex-shrink: 0;
  }
  .icon-nav .logo { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; color: var(--accent2); margin-bottom: 16px; letter-spacing: -1px; }
  .nav-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all .2s; font-size: 16px; }
  .nav-icon:hover, .nav-icon.active { background: var(--surface3); color: var(--text); }
  .nav-icon.active { color: var(--accent2); }
  .nav-icon svg { width: 18px; height: 18px; }
  .nav-spacer { flex: 1; }

  /* ---- SIDEBAR ---- */
  .sidebar {
    width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header { padding: 20px 18px 12px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
  .sidebar-actions { display: flex; gap: 6px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all .2s; background: transparent; border: none; }
  .icon-btn:hover { background: var(--surface3); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }

  .filter-tabs { display: flex; gap: 6px; padding: 0 18px 16px; }
  .filter-tab { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .2s; border: none; }
  .filter-tab.active { background: var(--accent); color: #fff; }
  .filter-tab:not(.active) { background: var(--surface2); color: var(--muted); }
  .filter-tab:not(.active):hover { background: var(--surface3); color: var(--text); }

  .room-list { flex: 1; overflow-y: auto; padding: 0 10px; }
  .room-list::-webkit-scrollbar { width: 4px; } .room-list::-webkit-scrollbar-track { background: transparent; } .room-list::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .room-item { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 12px; cursor: pointer; transition: all .2s; margin-bottom: 2px; }
  .room-item:hover, .room-item.active { background: var(--surface2); }
  .room-item.active { background: var(--surface3); }
  .room-avatar { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; position: relative; overflow: hidden; }
  .room-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
  .room-avatar .status-dot { position: absolute; bottom: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
  .room-info { flex: 1; min-width: 0; }
  .room-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .room-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .room-time { font-size: 11px; color: var(--muted); }
  .room-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 600; border-radius: 10px; padding: 1px 6px; min-width: 18px; text-align: center; }

  .sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border); }
  .sidebar-feedback { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; transition: color .2s; }
  .sidebar-feedback:hover { color: var(--text); }
  .sidebar-feedback svg { width: 16px; height: 16px; }

  /* ---- MAIN CHAT ---- */
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }

  .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: rgba(13,14,23,0.8); backdrop-filter: blur(10px); flex-shrink: 0; }
  .chat-title { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .chat-header-actions { display: flex; align-items: center; gap: 8px; }
  .header-icon-btn { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--surface); color: var(--muted); cursor: pointer; border: none; transition: all .2s; }
  .header-icon-btn:hover { background: var(--surface2); color: var(--text); }
  .header-icon-btn svg { width: 16px; height: 16px; }
  .user-count-badge { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .user-count-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }

  /* ---- MESSAGES ---- */
  .chat-messages { flex: 1; overflow-y: auto; padding: 24px 24px 8px; display: flex; flex-direction: column; gap: 4px; scroll-behavior: smooth; }
  .chat-messages::-webkit-scrollbar { width: 4px; } .chat-messages::-webkit-scrollbar-track { background: transparent; } .chat-messages::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .day-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0 8px; }
  .day-divider .line { flex: 1; height: 1px; background: var(--border); }
  .day-divider .label { font-size: 11px; color: var(--muted); white-space: nowrap; background: var(--surface2); padding: 3px 10px; border-radius: 20px; }

  .system-msg { text-align: center; }
  .system-msg .bubble { display: inline-block; background: rgba(108,99,255,0.15); border: 1px solid rgba(108,99,255,0.25); color: var(--accent2); font-size: 12.5px; border-radius: 20px; padding: 6px 16px; margin: 8px 0; }

  .msg-group { display: flex; flex-direction: column; gap: 2px; }
  .msg-group + .msg-group { margin-top: 14px; }

  .msg-row { display: flex; align-items: flex-end; gap: 10px; }
  .msg-row.mine { flex-direction: row-reverse; }

  .msg-avatar { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .msg-avatar.spacer { background: transparent; }

  .msg-content { display: flex; flex-direction: column; align-items: flex-start; max-width: 60%; }
  .msg-row.mine .msg-content { align-items: flex-end; }

  .msg-sender { font-size: 11px; color: var(--muted); margin-bottom: 4px; padding-left: 2px; }
  .msg-row.mine .msg-sender { padding-left: 0; padding-right: 2px; }

  .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 13.5px; line-height: 1.5; word-break: break-word; position: relative; }
  .msg-bubble.other { background: var(--surface2); border-radius: 4px 18px 18px 18px; }
  .msg-bubble.mine { background: linear-gradient(135deg, var(--accent), #8b5cf6); color: #fff; border-radius: 18px 4px 18px 18px; }
  .msg-bubble .emoji-only { font-size: 26px; line-height: 1.2; background: transparent; }

  .msg-time { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 2px; }

  .typing-indicator { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .typing-avatar { width: 32px; height: 32px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .typing-bubble { background: var(--surface2); border-radius: 4px 18px 18px 18px; padding: 12px 16px; display: flex; gap: 4px; }
  .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: typingBounce 1.4s ease-in-out infinite; }
  .typing-dot:nth-child(2) { animation-delay: .2s; }
  .typing-dot:nth-child(3) { animation-delay: .4s; }
  @keyframes typingBounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

  /* ---- INPUT ---- */
  .chat-input-area { padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .input-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 16px; transition: border-color .2s; }
  .input-row:focus-within { border-color: var(--accent); }
  .input-row input { flex: 1; background: transparent; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); }
  .input-row input::placeholder { color: var(--muted); }
  .attach-btn { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; transition: all .2s; border: none; background: transparent; }
  .attach-btn:hover { color: var(--text); }
  .attach-btn svg { width: 17px; height: 17px; }
  .send-btn { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; cursor: pointer; border: none; transition: all .2s; flex-shrink: 0; }
  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:active { transform: scale(.95); }
  .send-btn svg { width: 16px; height: 16px; }

  /* ---- RIGHT PANEL ---- */
  .right-panel { width: var(--panel-w); background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
  .right-panel::-webkit-scrollbar { width: 4px; } .right-panel::-webkit-scrollbar-track { background: transparent; } .right-panel::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .panel-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .panel-tab { flex: 1; padding: 14px 0; text-align: center; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; transition: all .2s; }
  .panel-tab.active { color: var(--text); border-bottom-color: var(--accent); }

  .panel-section { padding: 16px 16px 0; }
  .panel-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }

  .member-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .member-avatar { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .member-info .member-name { font-size: 13px; font-weight: 500; }
  .member-info .member-role { font-size: 11px; color: var(--muted); }
  .member-msg-btn { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; border: none; transition: all .2s; }
  .member-msg-btn:hover { background: var(--accent); color: #fff; }
  .member-msg-btn svg { width: 13px; height: 13px; }

  .panel-card { background: var(--surface2); border-radius: var(--radius); padding: 14px; margin: 0 16px 12px; cursor: pointer; transition: background .2s; }
  .panel-card:hover { background: var(--surface3); }
  .panel-card-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .panel-card-sub { font-size: 12px; color: var(--muted); }

  /* ---- LOGIN OVERLAY ---- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 380px; max-width: 90vw; }
  .login-logo { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--accent2); text-align: center; margin-bottom: 6px; }
  .login-tagline { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color .2s; }
  .form-input:focus { border-color: var(--accent); }
  .color-picker-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .2s, border-color .2s; }
  .color-swatch.selected { border-color: #fff; transform: scale(1.15); }
  .login-btn { width: 100%; padding: 12px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border: none; color: #fff; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s, transform .2s; margin-top: 8px; }
  .login-btn:hover { opacity: .9; }
  .login-btn:active { transform: scale(.98); }

  /* ---- ANIMATIONS ---- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-group { animation: fadeUp .25s ease forwards; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

  /* Scrollbar global */
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  /* Responsive tweaks */
  @media (max-width: 900px) {
    .right-panel { display: none; }
    .icon-nav { display: none; }
  }
  @media (max-width: 600px) {
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<!-- Login Overlay -->
<div class="overlay" id="overlay">
  <div class="login-box">
    <div class="login-logo">NexusChat</div>
    <div class="login-tagline">Real-time conversations, beautifully done.</div>
    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input class="form-input" id="nameInput" placeholder="Enter your display name..." maxlength="20"/>
    </div>
    <div class="form-group">
      <label class="form-label">Pick a color</label>
      <div class="color-picker-row" id="colorPicker"></div>
    </div>
    <button class="login-btn" onclick="joinChat()">Join Chat →</button>
  </div>
</div>

<!-- App Shell -->
<div class="app" id="appShell" style="display:none">
  <!-- Icon Nav -->
  <nav class="icon-nav">
    <div class="logo">N</div>
    <div class="nav-icon active" title="Messages"><?xml version="1.0"?><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
    <div class="nav-icon" title="People"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
    <div class="nav-icon" title="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
    <div class="nav-icon" title="Files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div>
    <div class="nav-spacer"></div>
    <div class="nav-icon" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg></div>
  </nav>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Messages</span>
      <div class="sidebar-actions">
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
    </div>
    <div class="filter-tabs">
      <button class="filter-tab active">Open</button>
      <button class="filter-tab">Done</button>
      <button class="filter-tab">Unread</button>
    </div>
    <div class="room-list" id="roomList">
      <div class="room-item active" onclick="switchRoom('general')">
        <div class="room-avatar" style="background:#6c63ff22;color:#a78bfa">🌐</div>
        <div class="room-info">
          <div class="room-name">General</div>
          <div class="room-preview" id="general-preview">Welcome everyone!</div>
        </div>
        <div class="room-meta">
          <div class="room-time" id="general-time">now</div>
        </div>
      </div>
      <div class="room-item" onclick="switchRoom('design')">
        <div class="room-avatar" style="background:#38bdf822;color:#38bdf8">🎨</div>
        <div class="room-info">
          <div class="room-name">Design</div>
          <div class="room-preview" id="design-preview">Share design ideas</div>
        </div>
        <div class="room-meta">
          <div class="room-time" id="design-time">now</div>
        </div>
      </div>
      <div class="room-item" onclick="switchRoom('random')">
        <div class="room-avatar" style="background:#f59e0b22;color:#f59e0b">⚡</div>
        <div class="room-info">
          <div class="room-name">Random</div>
          <div class="room-preview" id="random-preview">Off-topic fun zone</div>
        </div>
        <div class="room-meta">
          <div class="room-time" id="random-time">now</div>
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-feedback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span id="currentUserName">You</span>
      </div>
    </div>
  </aside>

  <!-- Main Chat -->
  <main class="chat-main">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="chatTitle">General</div>
      </div>
      <div class="chat-header-actions">
        <div class="user-count-badge">
          <div class="user-count-dot"></div>
          <span id="onlineCount">1 online</span>
        </div>
        <button class="header-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="header-icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <div class="input-row">
        <button class="attach-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <input type="text" id="msgInput" placeholder="Write a message..." autocomplete="off"/>
        <button class="attach-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>
        <button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </main>

  <!-- Right Panel -->
  <aside class="right-panel">
    <div class="panel-tabs">
      <div class="panel-tab active">Members</div>
      <div class="panel-tab">Files</div>
    </div>
    <div class="panel-section" style="margin-top:16px;">
      <div class="panel-label">Online</div>
      <div id="memberList"></div>
    </div>
    <div style="flex:1"></div>
    <div class="panel-card" onclick="">
      <div class="panel-card-title">🎨 Customize Chat</div>
      <div class="panel-card-sub">Change layout and colors</div>
    </div>
    <div class="panel-card" style="margin-bottom:16px">
      <div class="panel-card-title">🛟 Privacy & Support</div>
      <div class="panel-card-sub">Get immediate support</div>
    </div>
  </aside>
</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const COLORS = ['#6c63ff','#38bdf8','#34d399','#f59e0b','#f87171','#e879f9','#fb923c','#a78bfa'];
const STORAGE_KEY = 'nexuschat_msgs_v2';
const USERS_KEY   = 'nexuschat_users_v2';
const TYPING_KEY  = 'nexuschat_typing_v2';

let me = null;          // { id, name, color }
let currentRoom = 'general';
let pollingInterval = null;
let lastCount = 0;

// ─── COLOR PICKER ─────────────────────────────────────────────────────────────
let selectedColor = COLORS[0];
const cp = document.getElementById('colorPicker');
COLORS.forEach(c => {
  const sw = document.createElement('div');
  sw.className = 'color-swatch' + (c===selectedColor?' selected':'');
  sw.style.background = c;
  sw.onclick = () => { selectedColor = c; document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected')); sw.classList.add('selected'); };
  cp.appendChild(sw);
});

// ─── LOGIN ────────────────────────────────────────────────────────────────────
function joinChat() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('nameInput').focus(); return; }
  me = { id: Date.now() + Math.random(), name, color: selectedColor };
  document.getElementById('currentUserName').textContent = name;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  registerUser();
  loadMessages();
  startPolling();
  const input = document.getElementById('msgInput');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key==='Enter') sendMessage(); });
  document.getElementById('sendBtn').onclick = sendMessage;
}

// ─── USER PRESENCE ────────────────────────────────────────────────────────────
function getUsers() { try { return JSON.parse(localStorage.getItem(USERS_KEY)||'[]'); } catch { return []; } }
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

function registerUser() {
  const users = getUsers().filter(u => u.id !== me.id);
  users.push({ ...me, lastSeen: Date.now() });
  saveUsers(users);
}

function pruneUsers() {
  const cutoff = Date.now() - 15000;
  const users = getUsers().filter(u => u.lastSeen > cutoff);
  saveUsers(users);
  return users;
}

function heartbeat() {
  const users = getUsers();
  const idx = users.findIndex(u => u.id === me.id);
  if (idx >= 0) users[idx].lastSeen = Date.now(); else users.push({ ...me, lastSeen: Date.now() });
  saveUsers(users);
}

function renderMembers() {
  const users = pruneUsers();
  const count = users.length;
  if (count !== lastCount) {
    lastCount = count;
    document.getElementById('onlineCount').textContent = count + ' online';
    const ml = document.getElementById('memberList');
    ml.innerHTML = users.map(u => `
      <div class="member-item">
        <div class="member-avatar" style="background:${u.color}22;color:${u.color}">${u.name[0].toUpperCase()}</div>
        <div class="member-info">
          <div class="member-name">${esc(u.name)} ${u.id===me.id?'<span style="font-size:10px;color:var(--muted)">(you)</span>':''}</div>
          <div class="member-role" style="color:${u.color}">● online</div>
        </div>
        ${u.id!==me.id?`<button class="member-msg-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>`:''}
      </div>
    `).join('');
  }
}

// ─── MESSAGES ─────────────────────────────────────────────────────────────────
function getMsgs() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch { return {}; } }
function saveMsgs(m) { localStorage.setItem(STORAGE_KEY, JSON.stringify(m)); }

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const all = getMsgs();
  if (!all[currentRoom]) all[currentRoom] = [];
  const msg = { id: Date.now()+Math.random(), user: me, text, ts: Date.now(), room: currentRoom };
  all[currentRoom].push(msg);
  // Keep last 500 msgs per room
  if (all[currentRoom].length > 500) all[currentRoom] = all[currentRoom].slice(-500);
  saveMsgs(all);
  renderMessages();
}

let renderedIds = new Set();

function renderMessages() {
  const all = getMsgs();
  const msgs = all[currentRoom] || [];
  const container = document.getElementById('chatMessages');
  const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 80;

  // Find new msgs
  const newMsgs = msgs.filter(m => !renderedIds.has(m.id));
  if (newMsgs.length === 0) return;
  newMsgs.forEach(m => renderedIds.add(m.id));

  // Re-render all (simple approach for small msg counts)
  container.innerHTML = '';
  renderedIds = new Set();

  // Group by sender proximity
  let groups = [];
  msgs.forEach((msg, i) => {
    renderedIds.add(msg.id);
    const prev = msgs[i-1];
    if (prev && prev.user.id === msg.user.id && msg.ts - prev.ts < 60000) {
      groups[groups.length-1].push(msg);
    } else {
      groups.push([msg]);
    }
  });

  // Render day divider at start
  if (msgs.length > 0) {
    container.appendChild(makeDivider('Today'));
  }

  groups.forEach(group => {
    const isMe = group[0].user.id === me.id;
    const groupEl = document.createElement('div');
    groupEl.className = 'msg-group';

    group.forEach((msg, i) => {
      const row = document.createElement('div');
      row.className = 'msg-row' + (isMe?' mine':'');

      const showAvatar = i === 0;
      const avatarEl = document.createElement('div');
      avatarEl.className = 'msg-avatar' + (showAvatar?'':' spacer');
      if (showAvatar) {
        avatarEl.style.background = msg.user.color + '22';
        avatarEl.style.color = msg.user.color;
        avatarEl.textContent = msg.user.name[0].toUpperCase();
      }

      const contentEl = document.createElement('div');
      contentEl.className = 'msg-content';

      if (!isMe && i===0) {
        const senderEl = document.createElement('div');
        senderEl.className = 'msg-sender';
        senderEl.style.color = msg.user.color;
        senderEl.textContent = msg.user.name;
        contentEl.appendChild(senderEl);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + (isMe?'mine':'other');
      const isEmojiOnly = /^[\p{Emoji}\s]{1,4}$/u.test(msg.text) && msg.text.length <= 6;
      if (isEmojiOnly) bubble.classList.add('emoji-only');
      bubble.textContent = msg.text;

      contentEl.appendChild(bubble);

      if (i === group.length-1) {
        const timeEl = document.createElement('div');
        timeEl.className = 'msg-time';
        timeEl.textContent = formatTime(msg.ts);
        contentEl.appendChild(timeEl);
      }

      row.appendChild(avatarEl);
      row.appendChild(contentEl);
      groupEl.appendChild(row);
    });

    container.appendChild(groupEl);
  });

  if (atBottom || newMsgs.some(m => m.user.id === me.id)) {
    container.scrollTop = container.scrollHeight;
  }

  // Update sidebar preview
  const last = msgs[msgs.length-1];
  if (last) {
    const prev = document.getElementById(currentRoom+'-preview');
    const t = document.getElementById(currentRoom+'-time');
    if (prev) prev.textContent = last.user.name+': '+last.text.slice(0,25);
    if (t) t.textContent = formatTime(last.ts);
  }
}

function makeDivider(label) {
  const d = document.createElement('div');
  d.className = 'day-divider';
  d.innerHTML = `<div class="line"></div><div class="label">${label}</div><div class="line"></div>`;
  return d;
}

function loadMessages() {
  renderedIds = new Set();
  document.getElementById('chatMessages').innerHTML = '';
  renderMessages();
  // Add system welcome message if empty
  const all = getMsgs();
  if (!all[currentRoom] || all[currentRoom].length === 0) {
    const container = document.getElementById('chatMessages');
    const sys = document.createElement('div');
    sys.className = 'system-msg';
    sys.innerHTML = `<div class="bubble">👋 Welcome to <strong>${currentRoom}</strong> — say hello!</div>`;
    container.appendChild(sys);
  }
}

// ─── ROOM SWITCH ──────────────────────────────────────────────────────────────
function switchRoom(room) {
  currentRoom = room;
  document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('chatTitle').textContent = room.charAt(0).toUpperCase()+room.slice(1);
  loadMessages();
}

// ─── POLLING ─────────────────────────────────────────────────────────────────
function startPolling() {
  pollingInterval = setInterval(() => {
    heartbeat();
    renderMembers();
    renderMessages();
  }, 1500);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatTime(ts) {
  const d = new Date(ts);
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h>=12?'PM':'AM';
  h = h%12||12;
  return `${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}

// Filter tabs (cosmetic)
document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.onclick = () => { document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); };
});
document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.onclick = () => { document.querySelectorAll('.panel-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); };
});

// Enter to submit on login
document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') joinChat(); });
</script>
</body>
</html>
